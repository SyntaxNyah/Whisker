# Whisker AO2 Server Configuration
# All settings have sane defaults — only change what you need.

[server]
name = "My Whisker Server"
description = "An Attorney Online 2 server powered by Whisker"
motd = "Welcome! Type /help for commands."
addr = ""
port = 27016
max_players = 100
multiclient_limit = 16
asset_url = ""
default_ban_duration = "3d"

[websocket]
# Plain WebSocket for webAO (ws://)
enable_ws = true
ws_port = 27017

# Secure WebSocket (wss://)
# Option 1: Direct TLS (provide cert/key paths)
# Option 2: Reverse proxy (Cloudflare/nginx handles TLS, leave paths empty)
enable_wss = false
wss_port = 443
tls_cert_path = ""
tls_key_path = ""
allowed_origin = "*"

# For Cloudflare Tunnel / nginx reverse proxy setup:
# 1. Set enable_ws = true, ws_port to your internal port (e.g., 27017)
# 2. Point your reverse proxy to ws://localhost:27017
# 3. The proxy terminates TLS and forwards plain WS to Whisker
# 4. Enable reverse_proxy_mode in [proxy] to extract real IPs
# 5. Cloudflare tunnel: set type=HTTP, URL=localhost:27017

[ratelimit]
# IC/OOC/music message rate limit
msg_rate_limit = 20
msg_rate_window = 10

# OOC-specific rate limit (tighter)
ooc_rate_limit = 4
ooc_rate_window = 1

# Per-IP connection rate limit
conn_rate_limit = 10
conn_rate_window = 10

# Raw AO2 packet rate limit (all packets)
raw_pkt_rate_limit = 20
raw_pkt_rate_window = 2

# Auto-ban IPs that flood connections
conn_flood_autoban = true
flood_ban_threshold = 6

[proxy]
# Enable when behind a reverse proxy (Cloudflare, nginx, etc.)
# This extracts the real client IP from proxy headers.
reverse_proxy_mode = false

# Which header to trust for the real IP.
# Cloudflare: CF-Connecting-IP (also X-Forwarded-For)
# nginx: X-Forwarded-For or X-Real-IP
# All three are checked automatically when reverse_proxy_mode = true.
trusted_header = "X-Forwarded-For"

[moderation]
automod_enabled = false
automod_wordlist = "config/banned_words.txt"
automod_action = "kick"

[logging]
enable_area_logging = false
log_directory = "logs"

[plugins]
directory = "plugins"

# Read by the OPTIONAL afk plugin (drop afk.dll / .so into plugins/). Ignored if
# that plugin isn't installed. Every part is a toggle — run auto-AFK only, manual
# /afk only, both, or neither, and choose which surfaces show the tag.
[afk]
auto_afk = true             # the inactivity timer (set false to keep ONLY /afk)
timeout_seconds = 300       # idle seconds before auto-AFK
manual_command = true       # enable the /afk command
playerlist_indicator = true # show [AFK] on the 2.11 player list (needs player_list)
gas_indicator = true        # show [AFK] in /ga and /gas
announce = false            # broadcast "X is now AFK / back" to the area
label = "[AFK]"             # the tag text

# Read by the OPTIONAL lockdown plugin (drop lockdown.dll / .so into plugins/).
# A mod "known players only" switch — see the lockdown entry in OPTIONAL Plugins/README.md.
[lockdown]
permission = 4              # permission bits required to use /lockdown (4 = ban; matches roles.toml)
default_duration = "0"      # /lockdown on with no time: 0 = until /lockdown off (e.g. "30m", "2h")
announce = true             # post a MODS-ONLY OOC notice when lockdown toggles
persist = true              # remember known IPIDs across restarts (config/lockdown_known.txt)
# message = "..."           # the notice shown to a blocked new IPID (has a sane default)
